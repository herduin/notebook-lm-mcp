version: "3.8"

services:
  notebooklm-mcp:
    image: ghcr.io/herduin/notebook-lm-mcp:latest
    container_name: notebooklm-mcp
    restart: unless-stopped

    environment:
      # Google Cloud Configuration
      GOOGLE_PROJECT_ID: "gen-lang-client-0358240486"
      GOOGLE_PROJECT_NUMBER: "73187191969"
      GOOGLE_REGION: "global"
      NOTEBOOK_ID: "449eba98-d0b5-4ad6-9ee3-3865c321034a"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials/notebook-service-account-lc.json"

      # Model Configuration
      MODEL: "gemini-2.5-flash"

      # Server Configuration
      MCP_PORT: "3000"  # All endpoints on single port
      CORS_ORIGIN: "*"
      API_KEY: "test"   # Change this to a secure value

      # Cache & Performance
      CACHE_TTL: "300"
      MAX_RETRIES: "3"
      RETRY_DELAY_MS: "1000"
      REQUEST_TIMEOUT_MS: "30000"
      MAX_QUESTION_LENGTH: "4000"

      # Logging
      LOG_LEVEL: "info"

      # Deprecated (will be ignored but won't break the server)
      # ENABLE_HTTP_API: "true"
      # HTTP_API_PORT: "3100"

    volumes:
      # Mount your Google Cloud service account key
      - /home/ec2-user/notebook-lm/notebook-service-account-lc.json:/app/credentials/notebook-service-account-lc.json:ro

    ports:
      # Single port mapping for all endpoints
      - "3210:3000"

    networks:
      - app-net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

networks:
  app-net:
    external: true
