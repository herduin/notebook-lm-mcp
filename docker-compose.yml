version: '3.8'

services:
  notebooklm-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: notebooklm-mcp-server:latest
    container_name: notebooklm-mcp-server
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - GOOGLE_PROJECT_NUMBER=${GOOGLE_PROJECT_NUMBER}
      - GOOGLE_REGION=${GOOGLE_REGION:-us-central1}
      - NOTEBOOK_ID=${NOTEBOOK_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/key.json
      - MODEL=${MODEL:-gemini-1.5-pro-002}
      - PORT=${PORT:-3000}
      - CACHE_TTL=${CACHE_TTL:-300}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-1000}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-30000}
      - MAX_QUESTION_LENGTH=${MAX_QUESTION_LENGTH:-4000}
      - LOG_LEVEL=${LOG_LEVEL:-info}

    volumes:
      # Mount your Google Cloud service account key
      - ${GOOGLE_CREDENTIALS_PATH}:/credentials/key.json:ro

    ports:
      - "${PORT:-3000}:3000"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
